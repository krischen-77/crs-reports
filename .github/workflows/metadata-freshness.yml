name: CRS metadata freshness audit
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/metadata-freshness.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          sparse-checkout: |
            scripts
            data
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Verify official current-format PDF of the mirror-only recent discovery
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        shell: python
        run: |
          import sys,os,json,hashlib
          from datetime import datetime,timezone
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import sync_crs as s
          out=Path('metadata-evidence');out.mkdir(exist_ok=True)
          http=s.HTTP(os.getenv('CONGRESS_API_KEY',''))
          ident='IF13330'
          result={'id':ident,'checked_at':datetime.now(timezone.utc).isoformat(),'github_run_id':os.environ['GITHUB_RUN_ID']}
          try:
              obj=http.json(s.API+'/'+ident+'?format=json')
              s.write_json(out/(ident+'.json'),obj)
              row=next(v for k,v in obj.items() if k.lower()=='crsreport')
              assert row['id']==ident
              spec=next(f for f in row['formats'] if f['format'].upper()=='PDF')
              body,actual=http.get(spec.get('url') or spec['URL'])
              assert body.lstrip().startswith(b'%PDF-')
              with s.fitz.open(stream=body,filetype='pdf') as doc:
                  assert len(doc)>0 and not doc.needs_pass
              sha=hashlib.sha256(body).hexdigest()
              manifest=json.loads(Path('data/archive-manifest.json').read_text())
              matches=[v for v in manifest if v['id']==ident and v['pdf_sha256']==sha]
              result.update(title=row['title'],api_publication_date=row.get('publishDate'),api_update_date=row.get('updateDate'),
                            official_pdf_url=actual,pdf_sha256=sha,exact_pdf_archived=bool(matches),
                            archived_paths=[v['pdf'] for v in matches])
          except Exception as exc:result.update(exact_pdf_archived=False,error=str(exc))
          s.write_json(out/'receipt.json',result)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not result.get('exact_pdf_archived'):sys.exit(1)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: crs-metadata-freshness-evidence
          path: metadata-evidence/
          retention-days: 30
