name: CRS official-current reconciliation
"on":
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: crs-official-current
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools/tests -v
      - name: Plan current official entries and bounded metadata batches
        id: plan
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python tools/official_pipeline.py plan --out official-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: official-plan/
          retention-days: 30
          if-no-files-found: error
  resolve:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          sparse-checkout: |
            scripts
            tools
            .github/ops
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: official-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: official-plan
      - name: Resolve assigned official details and retain all failures
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          CHUNK: ${{ matrix.chunk }}
          PYTHONUNBUFFERED: '1'
        run: python tools/official_pipeline.py resolve --chunk "$CHUNK" --out official-resolved
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: official-resolved-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.chunk }}
          path: official-resolved/
          retention-days: 30
          if-no-files-found: error
  archive:
    needs: [plan, resolve]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: crs-archive-main
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: official-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: official-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: official-resolved-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: official-parts
      - name: Save live current official originals and unresolved entries
        id: official
        continue-on-error: true
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python tools/official_pipeline.py aggregate
      - name: Verify actual archive bytes and current run receipt
        id: verify
        if: always() && steps.official.outcome != 'skipped'
        continue-on-error: true
        shell: python
        run: |
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'.github/audits')
          import verify_crs as a
          status=json.loads(Path('data/official-status.json').read_text())
          assert status['github_run_id']==os.environ['GITHUB_RUN_ID'],'Stale official receipt'
          assert status['github_run_attempt']==os.environ['GITHUB_RUN_ATTEMPT'],'Stale official attempt'
          manifest=json.loads(Path('data/archive-manifest.json').read_text())
          valid,invalid=a.verify_manifest(Path('.').resolve(),manifest)
          assert not invalid,invalid
          sys.path.insert(0,'scripts')
          import crs_formats
          for item in json.loads(Path('data/html-original-manifest.json').read_text()) if Path('data/html-original-manifest.json').exists() else []:
              assert crs_formats.verify_html_entry(Path('.'),item),item['id']
          print('Actual PDF versions verified:',len(manifest))
          print('Official-current coverage:',status['official_current_verified'],'/',status['official_current_required'])
          print('Unresolved official current entries:',status['official_current_pending'])
      - name: Preserve successful watermark and classify partial source results
        id: gate
        if: always() && steps.verify.outcome == 'success'
        run: python .github/ops/stage_gate.py official
      - name: Commit verified files and honest official-current coverage
        id: persist
        if: always() && steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data pdf html markdown metadata LATEST.md CURRENT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: authoritative current CRS formats and coverage $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 5))"
            git pull --rebase origin main
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: official-current-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            official-evidence/
            data/official-status.json
            data/official-current.json
            data/official-pending.json
            data/archive-manifest.json
            data/audits/latest-official-current.csv
            data/audits/latest-official-current-comparisons.json
            CURRENT.md
            LATEST.md
          retention-days: 30
      - name: Fail on execution, archive integrity or persistence errors
        if: always() && (steps.verify.outcome != 'success' || steps.gate.outcome != 'success' || steps.persist.outcome != 'success')
        run: exit 1
  handoff:
    needs: [plan, resolve, archive]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          sparse-checkout: |
            .github/ops
            scripts
      - name: Independently audit persisted originals, including partial results
        if: needs.archive.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ops/dispatch_next.py audit
      - name: Report execution failure
        if: needs.archive.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ops/dispatch_next.py watchdog
