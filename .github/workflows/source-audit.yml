name: CRS source format audit
"on":
  workflow_dispatch:
  push:
    paths: [.github/workflows/source-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Inspect archived source metadata and public HTML snapshots
        shell: python
        run: |
          import json, hashlib, urllib.request, collections
          from pathlib import Path
          catalog = json.loads(Path('data/catalog.json').read_text())
          archive = json.loads(Path('data/archive-manifest.json').read_text())
          for ident in ['IF10045', 'IF10119', 'IF11806', 'IF13320', 'R46354', 'R49359']:
              print('\nREPORT:', ident, flush=True)
              print('API:', json.dumps(catalog.get(ident, {}).get('api', {}), ensure_ascii=False))
              path = Path('metadata/sources') / (ident + '.json')
              if path.exists():
                  record = json.loads(path.read_text())['versions'][0]
                  print('MIRROR:', json.dumps(record, ensure_ascii=False)[:6500])
              print('SAVED:', [(a['version'], a['date'], bool(a['html'])) for a in archive if a['id'] == ident])
          url = 'https://www.everycrsreport.com/files/2026-09-22_IF11806_2b429d2e6a40f9f4a4127028843cbe681dc04dc1.html'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'crs-reports-archive/1.0 (+https://github.com/krischen-77/crs-reports)'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read(5_000_000)
              print('\nHTML SHA1:', hashlib.sha1(data).hexdigest(), 'SIZE:', len(data))
              print('HTML START:', data[:2500].decode('utf-8', errors='replace'))
          except Exception as exc:
              print('HTML audit:', exc)
          print('PDFs:', len(archive), 'HTML:', sum(bool(a.get('html')) for a in archive))
          print('Version values:', dict(collections.Counter(str(v['version']) for v in archive)))
