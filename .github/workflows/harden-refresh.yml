name: CRS deploy refresh safeguards
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/harden-refresh.yml']
permissions:
  contents: read
concurrency:
  group: crs-archive-main
  cancel-in-progress: false
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Apply reviewed exact-match source repair
        run: python .github/ops/repair_20261028.py
      - name: Verify existing invariants and failure-injection regressions
        run: |
          python -m compileall -q scripts .github/ops
          python -m unittest discover -s tests -v
          python -m unittest discover -s tools/tests -v
          python -m unittest discover -s .github/audits -p 'test_*.py' -v
          python -m unittest discover -s .github/ops/tests -v
      - name: Commit only tested source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync_crs.py .github/ops/reliability.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: evidence-based historical scope, real success watermarks and deduplicated delivery alerts'
            git push origin HEAD:main
          fi
      - name: Run repaired daily collection and its verification chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ops/dispatch_next.py backup
