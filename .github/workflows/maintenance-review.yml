name: CRS tested system repair
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/maintenance-review.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            tools
            tests
            .github
            docs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Apply exact-hash source repair without changing any archive
        run: python .github/repairs/deploy_systemic_refresh.py
      - name: Run all 132 collector, original-format, verification and reliability tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tools/tests -v
          python -m unittest discover -s .github/audits -p 'test_*.py' -v
          python -m unittest discover -s .github/ops/tests -v
      - name: Commit only tested implementation and documentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/crs_formats.py scripts/sync_crs.py tools/official_pipeline.py tools/tests/test_original_formats.py .github/current-verification/verify_current.py .github/ops/reliability.py .github/ops/dispatch_next.py .github/ops/tests/test_quiet_monitoring.py docs/repair-2026-10-24.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix: recover omitted CRS formats, verify real originals and stop duplicate watchdog failures'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              if [[ "$attempt" == 3 ]]; then exit 1; fi
              git pull --rebase origin main
            done
          fi
      - name: Start real end-to-end refresh on the tested implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ops/dispatch_next.py backup
