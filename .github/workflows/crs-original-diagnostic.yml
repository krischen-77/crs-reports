name: CRS original validation diagnostic
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/crs-original-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          sparse-checkout: |
            scripts
            tools
            tests
            .github
      - name: Export only public source and test fixtures, never credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-diagnostic
          git rev-parse HEAD > source-diagnostic/source-commit.txt
          tar -czf source-diagnostic/source-code.tar.gz scripts tools tests .github requirements.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crs-original-diagnostic-${{ github.run_id }}
          path: source-diagnostic/
          retention-days: 7
          if-no-files-found: error
