name: CRS independent coverage audit
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coverage-audit.yml'
      - '.github/audits/**'
permissions:
  contents: read
concurrency:
  group: crs-independent-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run independent audit regression tests
        run: python -m unittest discover -s .github/audits -p 'test_*.py' -v
      - name: Verify live catalogs and original PDF bytes
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python .github/audits/verify_crs.py --days 7 --detail-limit 6 --direct-pdfs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: crs-independent-coverage-evidence
          path: coverage-evidence/
          retention-days: 30
          if-no-files-found: error
