name: CRS original validation diagnostic
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/crs-original-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          sparse-checkout: |
            scripts
            .github/ops
            data
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Inspect public official current-PDF pointer without accepting old revisions
        shell: python
        run: |
          import json, re, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import sync_crs as s
          import crs_formats as f
          item=json.loads(Path('data/official-current.json').read_text())['IN12598']
          task=f.task_from_item(item['api_metadata'])
          out=Path('source-diagnostic'); out.mkdir(exist_ok=True)
          result={'id':task['id'], 'detail_checked_at':item['detail_checked_at'],
                  'task':task, 'metadata':item['api_metadata'],
                  'purpose':'read-only canonical source diagnosis, NOT a coverage receipt'}
          # This is the public canonical current-PDF pointer, not an older numbered
          # file or a proxy for an access-denied HTML endpoint. HTTP retains all
          # existing host/rate/access checks and stops immediately on 401/403/429.
          ident=task['id']
          prefix=re.match(r'[A-Z]+', ident).group()
          url=f'https://crsreports.congress.gov/product/pdf/{prefix}/{ident}'
          result['requested_url']=url
          try:
              body, actual=s.HTTP('').get(url)
              result.update(actual_url=actual, bytes=len(body), sha256=s.digest(body))
              if body.lstrip().startswith(b'%PDF-'):
                  (out/'candidate.pdf').write_bytes(body)
                  with s.fitz.open(stream=body,filetype='pdf') as doc:
                      result['pages']=len(doc)
                      result['first_page_text']=doc[0].get_text()[:2500]
                      result['last_page_text']=doc[-1].get_text()[-2500:]
                  try:
                      f.validate_pdf(body, task)
                      result['validation']='passed_existing_strict_validation'
                  except Exception as exc:
                      result['validation']='not_verified'
                      result['validation_error']=f.error_text(exc)
              else:
                  result['validation']='not_pdf'
                  soup=s.BeautifulSoup(body,'html.parser')
                  result['page_title']=soup.title.get_text() if soup.title else ''
                  result['explicit_pdf_links']=[a.get('href') for a in soup.select('a[href]')
                      if ident in a.get('href','') and '.pdf' in a.get('href','')][:15]
          except Exception as exc:
              result['validation']='not_verified'
              result['error']=f.error_text(exc)
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crs-original-diagnostic-${{ github.run_id }}
          path: source-diagnostic/
          retention-days: 7
          if-no-files-found: error
