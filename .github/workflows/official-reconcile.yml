name: CRS official-current reconciliation
"on":
  workflow_dispatch:
  workflow_run:
    workflows: ['CRS daily backup']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-reconcile.yml'
      - 'tools/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: crs-official-current
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools/tests -v
      - id: seed
        shell: bash
        run: |
          if [[ ! -s data/official-current.json && "$(date -u +%F)" == '2026-10-23' ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.seed.outputs.needed == 'true'
        with:
          name: crs-metadata-freshness-evidence
          run-id: 39946003922
          github-token: ${{ github.token }}
          path: seed-six
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.seed.outputs.needed == 'true'
        with:
          name: crs-metadata-freshness-evidence
          run-id: 39947841170
          github-token: ${{ github.token }}
          path: seed-eight
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.seed.outputs.needed == 'true'
        with:
          name: crs-independent-coverage-evidence
          run-id: 39945243529
          github-token: ${{ github.token }}
          path: seed-newest
      - name: Reuse actual official-detail and PDF evidence already checked in this repair
        if: steps.seed.outputs.needed == 'true'
        shell: python
        run: |
          import sys,json
          from pathlib import Path
          sys.path.insert(0,'tools')
          import official_pipeline as p
          seeds={}
          for directory in ['seed-six','seed-eight']:
              base=Path(directory)
              for result in json.loads((base/'results.json').read_text()):
                  if not result.get('pdf_sha256'): continue
                  obj=json.loads((base/(result['id']+'.json')).read_text())
                  item=next(v for k,v in obj.items() if k.lower()=='crsreport')
                  seeds[result['id']]={'signal':p.signal(item),'task':p.task_from_item(item),'pdf_sha256':result['pdf_sha256'],'detail_checked_at':result['checked_at']}
          base=Path('seed-newest')
          for result in json.loads((base/'comparisons.json').read_text()):
              if not result.get('official_latest_detail',{}).get('archived_exact_bytes'): continue
              obj=json.loads((base/'official-detail'/(result['id']+'.json')).read_text())
              item=next(v for k,v in obj.items() if k.lower()=='crsreport')
              seeds[result['id']]={'signal':p.signal(item),'task':p.task_from_item(item),'pdf_sha256':result['official_latest_detail']['sha256'],'detail_checked_at':'2026-10-23T11:21:26+00:00'}
          p.s.write_json(Path('.github/repairs/official-seed.json'),seeds)
          print('Reused independently checked official entries:',len(seeds))
      - name: Plan current official entries and bounded metadata batches
        id: plan
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python tools/official_pipeline.py plan --out official-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-plan
          path: official-plan/
          retention-days: 30
          if-no-files-found: error
  resolve:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          sparse-checkout: |
            scripts
            tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: official-plan, path: official-plan}
      - name: Resolve assigned official details, honoring quota headers and retaining failures
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          CHUNK: ${{ matrix.chunk }}
          PYTHONUNBUFFERED: '1'
        run: python tools/official_pipeline.py resolve --chunk "$CHUNK" --out official-resolved
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: official-resolved-${{ matrix.chunk }}
          path: official-resolved/
          retention-days: 30
          if-no-files-found: error
  archive:
    needs: [plan, resolve]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: crs-archive-main
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: official-plan, path: official-plan}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: official-resolved-*
          path: official-parts
      - name: Save current official PDFs, retain older versions and report unresolved entries
        id: official
        continue-on-error: true
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python tools/official_pipeline.py aggregate
      - name: Verify actual archive bytes and current run receipt
        id: verify
        if: always() && steps.official.outcome != 'skipped'
        continue-on-error: true
        shell: python
        run: |
          import json,os,hashlib,sys
          from pathlib import Path
          sys.path.insert(0,'.github/audits')
          import verify_crs as a
          status=json.loads(Path('data/official-status.json').read_text())
          assert status['github_run_id']==os.environ['GITHUB_RUN_ID'],'Stale official receipt'
          assert status['github_run_attempt']==os.environ['GITHUB_RUN_ATTEMPT'],'Stale official attempt'
          manifest=json.loads(Path('data/archive-manifest.json').read_text())
          valid,invalid=a.verify_manifest(Path('.').resolve(),manifest)
          assert not invalid,invalid
          print('Actual PDF versions verified:',len(manifest))
          print('Official-current coverage:',status['official_current_verified'],'/',status['official_current_required'])
          print('Unresolved official current entries:',status['official_current_pending'])
      - name: Commit verified files and honest official-current coverage
        if: always() && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data pdf html markdown metadata LATEST.md CURRENT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: authoritative current CRS formats and coverage $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 5))"
            git pull --rebase origin main
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: official-current-verification
          path: |
            official-evidence/
            data/official-status.json
            data/official-current.json
            data/official-pending.json
            data/archive-manifest.json
            data/audits/latest-official-current.csv
            data/audits/latest-official-current-comparisons.json
            CURRENT.md
            LATEST.md
          retention-days: 30
      - name: Fail visibly when official-current coverage or verification is incomplete
        if: always() && (steps.official.outcome != 'success' || steps.verify.outcome != 'success')
        run: exit 1
