name: CRS original validation diagnostic
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/crs-original-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          sparse-checkout: |
            scripts
            .github/ops
            data
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Inspect only the live-declared current PDF candidate; no alternate routes
        shell: python
        run: |
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import sync_crs as s
          import crs_formats as f
          item=json.loads(Path('data/official-current.json').read_text())['IN12598']
          task=f.task_from_item(item['api_metadata'])
          out=Path('source-diagnostic'); out.mkdir(exist_ok=True)
          result={'id':task['id'], 'detail_checked_at':item['detail_checked_at'],
                  'task':task, 'purpose':'read-only validation diagnosis, not a coverage receipt'}
          try:
              body, actual=s.HTTP('').get(task['formats']['PDF']['urls'][0])
              result.update(actual_url=actual, bytes=len(body), sha256=s.digest(body))
              if body.lstrip().startswith(b'%PDF-'):
                  (out/'candidate.pdf').write_bytes(body)
                  with s.fitz.open(stream=body,filetype='pdf') as doc:
                      result['pages']=len(doc)
                      result['first_page_text']=doc[0].get_text()[:2000]
                      result['last_page_text']=doc[-1].get_text()[-2000:]
              f.validate_pdf(body, task)
              result['validation']='passed'
          except Exception as exc:
              result['validation']='not_verified'
              result['error']=f.error_text(exc)
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crs-original-diagnostic-${{ github.run_id }}
          path: source-diagnostic/
          retention-days: 7
          if-no-files-found: error
