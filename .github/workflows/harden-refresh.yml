name: CRS deploy refresh safeguards
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/harden-refresh.yml']
permissions:
  contents: read
concurrency:
  group: crs-archive-main
  cancel-in-progress: false
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Apply exact-match reviewed migration
        run: python .github/ops/harden.py
      - name: Verify old invariants and new failure-injection tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tools/tests -v
          python -m unittest discover -s .github/audits -p 'test_*.py' -v
          python -m unittest discover -s .github/ops/tests -v
      - name: Commit only tested implementation and documentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/current-verification/verify_current.py tools/official_pipeline.py README.md docs/daily-reliability.md
          if ! git diff --cached --quiet; then
            git commit -m 'fix: verified refresh watermarks, catch-up, bounded recovery and hourly watchdog'
            git push origin HEAD:main
          fi
