name: CRS daily backup
"on":
  schedule:
    - cron: '23 10,22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Minimum lookback days; automatic recovery expands after outages'
        default: '7'
        required: true
        type: string
      until:
        description: 'Optional inclusive UTC end date: YYYY-MM-DD'
        default: ''
        required: false
        type: string
      full_catalog:
        description: 'Refresh full official API catalog (requires CONGRESS_API_KEY)'
        default: false
        required: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: crs-archive-main
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, fetch-depth: 1}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect sources and archive originals
        id: sync
        continue-on-error: true
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LOOKBACK_DAYS: ${{ inputs.days || '7' }}
          UNTIL_DATE: ${{ inputs.until || '' }}
          FULL_CATALOG: ${{ inputs.full_catalog || false }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          effective_days=$(python .github/ops/freshness.py --days "$LOOKBACK_DAYS" --until "$UNTIL_DATE")
          args=(--days "$effective_days")
          if [[ -n "$UNTIL_DATE" ]]; then args+=(--until "$UNTIL_DATE"); fi
          if [[ "$FULL_CATALOG" == 'true' ]]; then args+=(--full-catalog); fi
          python scripts/sync_crs.py "${args[@]}"
      - name: Verify saved originals and current-run manifest
        id: verify
        if: always() && steps.sync.outcome != 'skipped'
        continue-on-error: true
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          status = json.loads(Path('data/status.json').read_text())
          assert status.get('github_run_id') == os.environ['GITHUB_RUN_ID'], 'Stale run receipt'
          assert status.get('github_run_attempt') == os.environ['GITHUB_RUN_ATTEMPT'], 'Stale run attempt'
          manifest = json.loads(Path('data/archive-manifest.json').read_text())
          for item in manifest:
              pdf = Path(item['pdf']).read_bytes()
              assert pdf.lstrip().startswith(b'%PDF-'), item['pdf']
              assert hashlib.sha256(pdf).hexdigest() == item['pdf_sha256'], item['pdf']
              assert Path(item['markdown']).is_file(), item['markdown']
              if item.get('html'):
                  assert hashlib.sha256(Path(item['html']).read_bytes()).hexdigest() == item['html_sha256'], item['html']
          print('Verified PDF versions:', len(manifest))
          print('Honest source result:', status['result'], status['errors'])
      - name: Classify source warnings without hiding incomplete coverage
        id: gate
        if: always() && steps.verify.outcome == 'success'
        run: python .github/ops/stage_gate.py backup
      - name: Commit archives and persistent retry evidence
        id: persist
        if: always() && steps.gate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in data pdf html markdown metadata LATEST.md; do
            if [[ -e "$path" ]]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive: CRS originals and source indexes $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 5))"
            git pull --rebase origin main
          done
          exit 1
      - name: Fail on actual execution, integrity or persistence errors
        if: always() && steps.sync.outcome != 'skipped' && (steps.verify.outcome != 'success' || steps.gate.outcome != 'success' || steps.persist.outcome != 'success')
        run: exit 1
      - name: Reconcile official current originals even after partial mirror collection
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ops/dispatch_next.py reconcile
      - name: Report execution failure through health monitoring
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ops/dispatch_next.py watchdog
