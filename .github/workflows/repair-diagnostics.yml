name: CRS repair diagnostics
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Summarize failure records without credentials
        shell: python
        run: |
          import json, pathlib, collections
          root = pathlib.Path('.')
          for date in ['2026-10-02', '2026-10-03']:
              for p in sorted((root/'data/runs'/date).glob('*.json')):
                  s=json.loads(p.read_text())
                  print(p, json.dumps({k:v for k,v in s.items() if k not in ('warnings','errors','reconciled_pending_discoveries')},ensure_ascii=False))
                  print('error count', len(s['errors']), 'first', s['errors'][:3])
          pending=json.loads((root/'data/pending.json').read_text())
          print('pending publication years', dict(collections.Counter(t['date'][:4] for t in pending['tasks'])))
          for ident in ['98-383','R40178','R46354']:
              task=next((t for t in pending['tasks'] if t['id']==ident),None)
              print('sample retry',json.dumps(task,ensure_ascii=False))
      - name: Bundle public code and metadata for offline regression tests
        run: tar -czf crs-diagnostics.tar.gz scripts tests requirements.txt README.md .github/workflows/crs-backup.yml data metadata/sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crs-repair-diagnostics
          path: crs-diagnostics.tar.gz
          retention-days: 3
