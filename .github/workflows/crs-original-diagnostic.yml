name: CRS original validation diagnostic
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/crs-original-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          sparse-checkout: |
            scripts
            tools
            .github
            data
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Compare live metadata signals and advertised original
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        shell: python
        run: |
          import json, os, sys
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          sys.path[:0]=['scripts','tools','.github/ops']
          import sync_crs as s
          import crs_formats as f
          import official_pipeline as p
          out=Path('source-diagnostic'); out.mkdir(exist_ok=True)
          http=s.HTTP(os.getenv('CONGRESS_API_KEY','').strip())
          now=datetime.now(timezone.utc)
          cache=s.read_json(Path('data/official-current.json'),{})
          result={'checked_at':now.isoformat(),'purpose':'diagnosis only; not a successful coverage receipt'}
          try:
              rows,count=s.api_scan(http,now.date()-timedelta(days=7),now.date())
              drift=[]
              for row in rows:
                  if p.is_required(row,now.date()-timedelta(days=7),now.date()):
                      cached=cache.get(row['id'],{})
                      if cached.get('signal') != p.signal(row):
                          drift.append({'id':row['id'],'live_list_signal':p.signal(row),
                              'cached_list_signal':cached.get('signal'),'detail_checked_at':cached.get('detail_checked_at'),
                              'detail_update':cached.get('api_metadata',{}).get('updateDate'),
                              'detail_version':cached.get('api_metadata',{}).get('currentVersion'),
                              'list_version':row.get('version')})
              result['list_detail_drift']=drift
              s.write_json(out/'official-list.json',rows)
              raw,actual=http.get(s.API+'/IN12598?format=json')
              s.write(out/'IN12598-api-response.json',raw)
              item=f.report_item(json.loads(raw))
              result['metadata']={k:v for k,v in item.items() if k!='summary'}
              result['api_summary_characters']=len(item.get('summary',''))
              task=f.task_from_item(item)
              declared=[v for v in item.get('formats',[]) if str(v.get('format','')).upper() in ('PDF','HTML')]
              result['original_checks']=[]
              for fmt in declared:
                  kind=str(fmt['format']).upper();url=fmt.get('url') or fmt.get('URL')
                  check={'kind':kind,'url':url}
                  try:
                      body,actual=http.get(url)
                      (f.validate_pdf if kind=='PDF' else f.validate_html)(body,task)
                      s.write(out/('IN12598-original.'+kind.lower()),body)
                      check.update(validation='passed',sha256=s.digest(body),bytes=len(body),actual_url=actual)
                  except Exception as exc:
                      check.update(validation='unverified',error=f.error_text(exc))
                  result['original_checks'].append(check)
          except Exception as exc:
              result['diagnostic_error']=f.error_text(exc)
          result['api_calls']=http.api_calls;result['quota_remaining']=http.api_remaining
          s.write_json(out/'result.json',result)
          print(json.dumps(result,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crs-original-diagnostic-${{ github.run_id }}
          path: source-diagnostic/
          retention-days: 7
          if-no-files-found: error
