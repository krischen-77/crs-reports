name: CRS original validation diagnostic
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/crs-original-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          sparse-checkout: |
            scripts
            tools
            .github
            data
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Validate public HTML export without weakening original checks
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        shell: python
        run: |
          import json, os, re, sys
          from pathlib import Path
          from datetime import datetime, timezone
          sys.path[:0]=['scripts','tools','.github/ops']
          import sync_crs as s
          import crs_formats as f
          out=Path('source-diagnostic'); out.mkdir(exist_ok=True)
          http=s.HTTP(os.getenv('CONGRESS_API_KEY','').strip())
          result={'checked_at':datetime.now(timezone.utc).isoformat(),
                  'purpose':'public export diagnosis, not a coverage receipt'}
          try:
              raw,_=http.get(s.API+'/IN12598?format=json')
              s.write(out/'IN12598-api-response.json',raw)
              item=f.report_item(json.loads(raw));task=f.task_from_item(item)
              url=task['formats']['HTML']['urls'][0]
              assert re.fullmatch(r'https://www\.congress\.gov/crs_external_products/IN/HTML/IN12598\.html',url)
              # The static web-export naming convention is independently validated;
              # this is not an old revision, proxy, authenticated endpoint or header spoof.
              # Retain normal 401/403/429 handling: one public export request, then stop.
              candidate=url[:-5]+'.web.html'
              result['requested_url']=candidate
              body,actual=http.get(candidate)
              f.validate_html(body,task)
              soup=s.BeautifulSoup(body,'html.parser')
              for node in soup.select('script,style,noscript'):node.decompose()
              text=soup.get_text(' ',strip=True)
              norm=lambda v:' '.join(re.findall(r'\w+',v.casefold()))
              summary=norm(item.get('summary',''))
              assert len(summary)>1000 and summary in norm(text), 'Current official API text not fully present; do not accept export'
              s.write(out/'IN12598-original.html',body)
              result.update(validation='passed',actual_url=actual,sha256=s.digest(body),bytes=len(body),
                  api_version=item.get('currentVersion'),api_update=item.get('updateDate'),
                  visible_start=text[:1200],visible_end=text[-1200:])
          except Exception as exc:
              result.update(validation='unverified',error=f.error_text(exc))
          result['api_calls']=http.api_calls;result['quota_remaining']=http.api_remaining
          s.write_json(out/'result.json',result)
          print(json.dumps(result,ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crs-original-diagnostic-${{ github.run_id }}
          path: source-diagnostic/
          retention-days: 7
          if-no-files-found: error
