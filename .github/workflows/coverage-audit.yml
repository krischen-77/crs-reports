name: CRS independent coverage audit
"on":
  workflow_dispatch:
  workflow_run:
    workflows: ['CRS official-current reconciliation']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: crs-independent-current-verification
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run collector, canonical-format and independent-audit regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tools/tests -v
          python -m unittest discover -s .github/audits -p 'test_*.py' -v
      - name: Redownload official-current PDFs and compare with actual archive bytes
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python .github/current-verification/verify_current.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: crs-independent-coverage-evidence
          path: coverage-evidence/
          retention-days: 30
          if-no-files-found: error
