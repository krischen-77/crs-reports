name: CRS independent coverage audit
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crs-independent-current-verification
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Run all collector, canonical and reliability regressions
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tools/tests -v
          python -m unittest discover -s .github/audits -p 'test_*.py' -v
          python -m unittest discover -s .github/ops/tests -v
      - name: Independently redownload and verify official-current bytes
        id: audit
        continue-on-error: true
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python .github/current-verification/verify_current.py
      - name: Persist actual receipt; never advance watermark on failure
        id: receipt
        if: always() && steps.audit.outcome != 'skipped'
        continue-on-error: true
        run: python .github/ops/reliability.py publish
      - name: Validate receipt and fail immediately on corrupted archived files
        id: gate
        if: always() && steps.audit.outcome != 'skipped'
        run: python .github/ops/stage_gate.py audit
      - name: Commit truthful verification receipt
        id: persist
        if: always() && steps.audit.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('data/verification-status.json').read_text())
          assert r['github_run_id']==os.environ['GITHUB_RUN_ID']
          assert r['github_run_attempt']==os.environ['GITHUB_RUN_ATTEMPT']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/verification-status.json data/audits/verification-*.json
          if [[ -f data/audit-detail-cache.json ]]; then git add data/audit-detail-cache.json; fi
          if [[ -f data/last-successful-verification.json ]]; then git add data/last-successful-verification.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "verify: independent CRS current-file receipt $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 5))"
            git pull --rebase origin main
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: crs-independent-coverage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Fail on missing receipts, integrity loss or failed persistence
        if: always() && steps.audit.outcome != 'skipped' && (steps.gate.outcome != 'success' || steps.persist.outcome != 'success')
        run: exit 1
      - name: Refresh health after audit result and receipt have been persisted
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ops/dispatch_next.py watchdog
